<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Russia Regime Early-Warning Dashboard</title><script src="https://cdn.plot.ly/plotly-3.1.0.min.js"></script><script src="data.js"></script><style>
:root{--bg:#05070b;--p:#0d1117;--t:#f8fafc;--m:#9aa7bb;--b:#263244}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px Inter,system-ui,sans-serif}.page{max-width:1580px;margin:auto;padding:24px}h1{font-size:38px;margin:0 0 8px;letter-spacing:-.03em}.sub{color:var(--m);max-width:1100px;line-height:1.5}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{background:var(--p);border:1px solid var(--b);color:var(--t);padding:9px 13px;border-radius:999px;cursor:pointer;font-weight:700}.on{background:#2b2033}.view{display:none}.view.on{display:block}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}.card,.panel{background:var(--p);border:1px solid var(--b);border-radius:15px;padding:14px}.k{color:var(--m);font-size:11px;text-transform:uppercase;font-weight:800}.v{font-size:30px;font-weight:850;margin-top:5px}.s{color:var(--m);font-size:12px;margin-top:6px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.chart{height:500px}.smgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.sm{height:330px}.note{line-height:1.55;color:#dce5f1}.table{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:8px;border-bottom:1px solid var(--b);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.g2,.smgrid{grid-template-columns:1fr}}@media(max-width:550px){.cards{grid-template-columns:1fr}.page{padding:12px}}
</style></head><body><div class="page"><h1>Russia Regime Early-Warning Dashboard</h1><div class="sub">Weekly analyst-coded monitor of elite fracture, public dissent, coercive securitization, structural-economic stress and state-capacity erosion. Scale 1–5. Updated through <b>2 October 2026</b>.</div><div class="tabs"><button class="on" data-v="overview">Overview</button><button data-v="metrics">All metrics</button><button data-v="momentum">Momentum</button><button data-v="drivers">Drivers</button><button data-v="corr">Correlations</button><button data-v="trajectory">Trajectory</button><button data-v="data">Data</button></div>
<section id="overview" class="view on"><div class="cards" id="cards"></div><div class="g2"><div class="panel"><div id="comp" class="chart"></div></div><div class="panel"><div id="radar" class="chart"></div></div></div><div class="g2" style="margin-top:14px"><div class="panel"><div id="gap" class="chart"></div></div><div class="panel"><h3>Latest analytical read</h3><div id="note" class="note"></div></div></div></section>
<section id="metrics" class="view"><div id="smgrid" class="smgrid"></div></section><section id="momentum" class="view"><div class="g2"><div class="panel"><div id="heat" class="chart"></div></div><div class="panel"><div id="mom" class="chart"></div></div></div></section><section id="drivers" class="view"><div class="g2"><div class="panel"><div id="stack" class="chart"></div></div><div class="panel"><div id="driver" class="chart"></div></div></div></section><section id="corr" class="view"><div class="panel"><div id="corrplot" class="chart"></div></div></section><section id="trajectory" class="view"><div class="g2"><div class="panel"><div id="traj" class="chart"></div></div><div class="panel"><div id="publicconv" class="chart"></div></div></div><div class="panel" style="margin-top:14px"><div id="eliteconv" class="chart"></div></div></section><section id="data" class="view"><div class="panel table"><table id="tbl"></table></div></section></div><script>
const names=["Elite rupture","Elite divergence","Public dissatisfaction","Mobilized dissent","Structural-economic stress","Coercive securitization","State-capacity erosion"],keys=["elite_rupture","elite_divergence","public_dissatisfaction","mobilized_dissent","structural_stress","coercive_securitization","state_capacity_erosion"],cols=["#ff9eb5","#ffc9a9","#f0b4ff","#b8d7ff","#ffd59e","#c5b7ff","#9ef0d0"],sw=[0,.20,.18,.08,.22,.14,.18],rw=[.30,.18,.12,.22,.18,0,0];
const rows=REGIME_DATA.map(a=>{let r={date:a[0],note:a[8]};keys.forEach((k,i)=>r[k]=a[i+1]);r.stress=keys.reduce((s,k,i)=>s+r[k]*sw[i],0);r.rupture=keys.reduce((s,k,i)=>s+r[k]*rw[i],0);r.gap=r.stress-r.rupture;return r}),dates=rows.map(r=>r.date),last=rows.at(-1),first=rows[0],cfg={responsive:true,displaylogo:false};
const L={paper_bgcolor:"#0d1117",plot_bgcolor:"#0d1117",font:{color:"#f8fafc"},margin:{l:55,r:20,t:45,b:55},xaxis:{gridcolor:"#243044"},yaxis:{gridcolor:"#243044"},legend:{orientation:"h",y:1.12}},line=(k,n,c)=>({x:dates,y:rows.map(r=>r[k]),type:"scatter",mode:"lines+markers",name:n,line:{color:c,width:3},marker:{color:c,size:7},customdata:rows.map(r=>r.note),hovertemplate:"%{x}<br><b>%{y:.2f}</b><br>%{customdata}<extra></extra>"}),d=x=>x.toFixed(2),chg=k=>(last[k]-first[k]).toFixed(2);
cards.innerHTML=[["Regime stress",d(last.stress),"+"+chg("stress")+" since Jun 5"],["Rupture potential",d(last.rupture),"+"+chg("rupture")+" since Jun 5"],["Stress–rupture gap",d(last.gap),"Pressure not yet converted"],["Structural stress",d(last.structural_stress),"Material-system pressure"],["Elite rupture",d(last.elite_rupture),"Still comparatively low"]].map(x=>'<div class="card"><div class="k">'+x[0]+'</div><div class="v">'+x[1]+'</div><div class="s">'+x[2]+'</div></div>').join("");
Plotly.newPlot("comp",[line("stress","Regime Stress Index","#fff3a6"),line("rupture","Rupture Potential Index","#ffb3c7")],{...L,title:"Composite trajectory",yaxis:{...L.yaxis,range:[1,5]}},cfg);Plotly.newPlot("radar",[{type:"scatterpolar",r:[...keys.map(k=>last[k]),last[keys[0]]],theta:[...names,names[0]],fill:"toself",line:{color:"#f0b4ff",width:3}}],{...L,title:"Latest regime profile",polar:{bgcolor:"#0d1117",radialaxis:{range:[1,5],gridcolor:"#243044"},angularaxis:{gridcolor:"#243044"}},showlegend:false},cfg);Plotly.newPlot("gap",[line("gap","Stress–rupture gap","#b8d7ff")],{...L,title:"Pressure accumulation without political conversion"},cfg);note.innerHTML="<b>2 October 2026</b><br><br>"+last.note+"<br><br><b>Interpretation:</b> the regime is moving deeper into a high-stress / low-conversion configuration: material, fiscal and administrative pressures are severe, while elite defection and scalable opposition remain limited.";
keys.forEach((k,i)=>{smgrid.insertAdjacentHTML("beforeend",'<div class="panel"><div id="sm'+i+'" class="sm"></div></div>');Plotly.newPlot("sm"+i,[line(k,names[i],cols[i])],{...L,title:names[i],yaxis:{...L.yaxis,range:[1,5]}},cfg)});
const delta=keys.map(k=>rows.map((r,i)=>i?r[k]-rows[i-1][k]:null));Plotly.newPlot("heat",[{z:delta,x:dates,y:names,type:"heatmap",zmid:0,colorscale:[[0,"#7fb3ff"],[.5,"#111827"],[1,"#ff9eb5"]]}],{...L,title:"Week-on-week momentum",margin:{l:165,r:20,t:50,b:70}},cfg);const latest=keys.map((k,i)=>({n:names[i],v:last[k]-rows.at(-2)[k],c:cols[i]})).sort((a,b)=>a.v-b.v);Plotly.newPlot("mom",[{x:latest.map(x=>x.v),y:latest.map(x=>x.n),type:"bar",orientation:"h",marker:{color:latest.map(x=>x.c)}}],{...L,title:"Latest weekly change",margin:{l:165,r:20,t:50,b:55}},cfg);
const sk=keys.filter((k,i)=>sw[i]);Plotly.newPlot("stack",sk.map(k=>{let i=keys.indexOf(k);return{x:dates,y:rows.map(r=>r[k]*sw[i]),type:"bar",name:names[i],marker:{color:cols[i]}}}),{...L,title:"Regime Stress Index decomposition",barmode:"stack"},cfg);const drv=sk.map(k=>{let i=keys.indexOf(k);return{n:names[i],v:(last[k]-first[k])*sw[i],c:cols[i]}}).sort((a,b)=>a.v-b.v);Plotly.newPlot("driver",[{x:drv.map(x=>x.v),y:drv.map(x=>x.n),type:"bar",orientation:"h",marker:{color:drv.map(x=>x.c)}}],{...L,title:"Increase in stress contribution since June",margin:{l:180,r:20,t:50,b:55}},cfg);
function pear(a,b){let ma=a.reduce((s,x)=>s+x,0)/a.length,mb=b.reduce((s,x)=>s+x,0)/b.length,n=0,da=0,db=0;a.forEach((x,i)=>{n+=(x-ma)*(b[i]-mb);da+=(x-ma)**2;db+=(b[i]-mb)**2});return n/Math.sqrt(da*db)}const cm=keys.map(a=>keys.map(b=>pear(rows.map(r=>r[a]),rows.map(r=>r[b]))));Plotly.newPlot("corrplot",[{z:cm,x:names,y:names,type:"heatmap",zmin:-1,zmax:1,zmid:0,colorscale:[[0,"#7fb3ff"],[.5,"#111827"],[1,"#ff9eb5"]],text:cm.map(r=>r.map(v=>v.toFixed(2))),texttemplate:"%{text}"}],{...L,title:"Metric correlation matrix",margin:{l:180,r:30,t:50,b:160}},cfg);
function tr(x,y,title,xlab,ylab){Plotly.newPlot(title,[{x:rows.map(r=>r[x]),y:rows.map(r=>r[y]),type:"scatter",mode:"lines+markers",line:{color:"#9ef0d0",width:3},marker:{size:rows.map((r,i)=>7+i*.4),color:rows.map((r,i)=>i),colorscale:"Viridis"},customdata:dates,hovertemplate:"%{customdata}<br>x=%{x:.2f}<br>y=%{y:.2f}<extra></extra>"}],{...L,title:xlab+" → "+ylab,xaxis:{...L.xaxis,title:xlab},yaxis:{...L.yaxis,title:ylab}},cfg)}tr("stress","rupture","traj","Regime stress","Rupture potential");tr("public_dissatisfaction","mobilized_dissent","publicconv","Public dissatisfaction","Mobilized dissent");tr("elite_divergence","elite_rupture","eliteconv","Elite divergence","Elite rupture");
tbl.innerHTML="<thead><tr><th>Date</th>"+names.map(n=>"<th>"+n+"</th>").join("")+"<th>Stress</th><th>Rupture</th></tr></thead><tbody>"+rows.map(r=>"<tr><td>"+r.date+"</td>"+keys.map(k=>"<td>"+d(r[k])+"</td>").join("")+"<td>"+d(r.stress)+"</td><td>"+d(r.rupture)+"</td></tr>").join("")+"</tbody>";
document.querySelectorAll("button[data-v]").forEach(b=>b.onclick=()=>{document.querySelectorAll("button[data-v],.view").forEach(x=>x.classList.remove("on"));b.classList.add("on");document.getElementById(b.dataset.v).classList.add("on");setTimeout(()=>window.dispatchEvent(new Event("resize")),50)});
</script></body></html>
